<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FOOTY PRO 2026</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#0e1620;color:#fff;padding-bottom:85px}.top{background:#ffcc00;padding:10px 12px;display:flex;justify-content:space-between;color:#000;font-weight:900;position:sticky;top:0;z-index:99}.bal{background:#000;color:#ffcc00;padding:5px 12px;border-radius:20px;font-size:13px}.nav{display:flex;background:#1a2935;position:sticky;top:42px;z-index:98;overflow:auto;border-bottom:1px solid #253a4a}.nav button{padding:12px 14px;background:transparent;border:none;color:#8aa1b5;font-weight:700;border-bottom:3px solid transparent;white-space:nowrap;font-size:12px}.nav button.active{color:#fff;border-color:#ffcc00;background:#253a4a}.stime{padding:6px 12px;font-size:11px;color:#00e676;background:#0e1620;text-align:center;border-bottom:1px solid #1a2935;letter-spacing:.3px}.filters{display:flex;gap:6px;padding:8px;background:#0e1620;overflow:auto;position:sticky;top:85px;z-index:97}.filters button{padding:6px 14px;border-radius:20px;border:1px solid #253a4a;background:#1a2935;color:#8aa1b5;font-size:11px;font-weight:700;white-space:nowrap}.filters button.active{background:#ffcc00;color:#000;border-color:#ffcc00}.league{background:#16202b;padding:7px 12px;font-size:10px;color:#8aa1b5;display:flex;justify-content:space-between;font-weight:800}.match{background:#1a2935;border-bottom:1px solid #0e1620;padding:10px 12px}.match.live{border-left:3px solid #ff3b30}.teams{display:flex;justify-content:space-between;font-weight:700;font-size:13px}.live-badge{background:#ff3b30;color:#fff;padding:2px 6px;border-radius:4px;font-size:10px;animation:blink 1s infinite}@keyframes blink{50%{opacity:.5}}.time{font-size:10px;color:#00e676;margin-top:2px}.odds{display:flex;gap:5px;margin-top:8px}.odds div{flex:1;background:#253a4a;padding:9px 2px;text-align:center;border-radius:6px;font-weight:800;font-size:12px;border:1px solid #2a4052;line-height:14px}.odds div span{font-size:10px;color:#8aa1b5;display:block;font-weight:600}.odds div.selected{background:#ffcc00;color:#000}.odds div.selected span{color:#000}.betslip{position:fixed;bottom:0;left:0;right:0;background:#1a2935;border-top:2px solid #ffcc00;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;z-index:100}.page{display:none}.page.active{display:block}</style></head><body>
<div class="top"><div>FOOTYPRO 2026</div><div class="bal">KES <span id="b">50.00</span></div></div>
<div class="nav"><button class="active" onclick="tab('soccer',this)">⚽ SOCCER</button><button onclick="tab('live',this)">🔴 LIVE (<span id="lc">0</span>)</button><button onclick="tab('aviator',this)">✈️ AVIATOR</button><button onclick="tab('mpesa',this)">👤 M-PESA</button></div>
<div id="soccer" class="page active"><div id="serverTime" class="stime">Loading time...</div><div class="filters"><button class="active" onclick="filterDay(-1,this)">ALL</button><button onclick="filterDay(0,this)">TODAY</button><button onclick="filterDay(1,this)">TOMORROW</button><button onclick="filterDay(7,this)">NEXT 7 DAYS</button><button onclick="filterDay(99,this)">🔴 LIVE</button></div><div id="list"></div></div>
<div id="live" class="page"><div id="liveList"></div></div>
<div id="aviator" class="page"><div style="margin:8px;background:#0a121a;border-radius:12px;padding:20px;text-align:center"><div id="mu" style="font-size:48px;font-weight:900;color:#ffcc00">1.00x</div><div id="pl" style="font-size:30px">✈️</div><div id="hist" style="display:flex;gap:4px;overflow:auto;margin-top:10px"></div></div><div style="display:flex;gap:8px;padding:10px"><input id="am" value="20" style="flex:1;padding:12px;background:#1a2935;border:1px solid #333;color:#fff;border-radius:8px;text-align:center"><button id="ab" onclick="av()" style="flex:1;padding:12px;background:#00e676;border:none;border-radius:8px;font-weight:900">BET</button></div></div>
<div id="mpesa" class="page"><div style="padding:12px"><div style="background:#1a2935;padding:15px;border-radius:12px"><h3 style="color:#ffcc00">M-PESA</h3><p style="margin:8px 0;font-size:12px">Paybill: 123456<br>Account: FOOTYPRO</p><button style="width:100%;padding:14px;background:#ffcc00;border:none;border-radius:10px;font-weight:900">DEPOSIT</button></div></div></div>
<div class="betslip"><div><div style="font-size:10px;color:#8aa1b5">Betslip</div><div style="font-weight:800;font-size:13px"><span id="c">0</span> bets - KES <span id="st">0</span></div></div><button style="padding:11px 18px;background:#ffcc00;border:none;border-radius:8px;font-weight:900;font-size:13px" onclick="alert('Betslip: '+cc+' bets placed!')">PLACE BET</button></div>
<script>
let allMatches=[],cc=0,curFilter=-1;
function tab(id,e){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));e.classList.add('active');if(id=='live')curFilter=99,render();if(id=='soccer')curFilter=-1,render()}
function filterDay(d,el){curFilter=d;document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));el.classList.add('active');render()}
function s(el){el.classList.toggle('selected');cc=document.querySelectorAll('.selected').length;document.getElementById('c').innerText=cc;document.getElementById('st').innerText=cc*50}
function render(){let list=document.getElementById('list');let llist=document.getElementById('liveList');let filtered=allMatches;if(curFilter==0)filtered=allMatches.filter(m=>m.day==0);else if(curFilter==1)filtered=allMatches.filter(m=>m.day==1);else if(curFilter==7)filtered=allMatches.filter(m=>m.day<=7);else if(curFilter==99)filtered=allMatches.filter(m=>m.live);
document.getElementById('lc').innerText=allMatches.filter(m=>m.live).length;
let html='',lastLeague='';filtered.forEach(m=>{if(m.league!=lastLeague){html+=`<div class="league"><span>${m.flag} ${m.league}</span><span>${m.date_label}</span></div>`;lastLeague=m.league}
html+=`<div class="match ${m.live?'live':''}"><div class="teams"><span>${m.home} ${m.live?`<span class="live-badge">${m.minute}'</span>`:''} vs ${m.away}</span><span style="color:${m.live?'#ff3b30':'#8aa1b5'};font-size:10px">${m.live?m.score:m.time}</span></div><div class="time">${m.date_label} ${m.live?'- LIVE ODDS':''}</div><div class="odds"><div onclick="s(this)"><span>1</span>${m.odds[0]}</div><div onclick="s(this)"><span>X</span>${m.odds[1]}</div><div onclick="s(this)"><span>2</span>${m.odds[2]}</div></div></div>`});
list.innerHTML=html||'<div style="padding:20px;text-align:center;color:#8aa1b5">No matches</div>';
let liveM=allMatches.filter(m=>m.live);let lhtml='';lastLeague='';liveM.forEach(m=>{if(m.league!=lastLeague){lhtml+=`<div class="league"><span>${m.flag} ${m.league}</span><span style="color:#ff3b30">🔴 LIVE</span></div>`;lastLeague=m.league}lhtml+=`<div class="match live"><div class="teams"><span>${m.home} <b style="color:#ff3b30">${m.score}</b> ${m.away} <span class="live-badge">${m.minute}'</span></span><span style="color:#ff3b30">${m.minute}'</span></div><div class="odds"><div onclick="s(this)"><span>1</span>${(m.odds[0]*0.9).toFixed(2)}</div><div onclick="s(this)"><span>X</span>${(m.odds[1]*1.1).toFixed(2)}</div><div onclick="s(this)"><span>2</span>${(m.odds[2]*0.95).toFixed(2)}</div></div></div>`});llist.innerHTML=lhtml||'<div style="padding:20px;text-align:center;color:#8aa1b5">No live matches now</div>'}
function load(){fetch('/api/matches').then(r=>r.json()).then(d=>{if(d.matches){allMatches=d.matches;let el=document.getElementById('serverTime');if(el)el.innerText='⏰ '+d.server_time+' | GAMES UPDATED LIVE'}else{allMatches=d}render()})}load();setInterval(()=>{allMatches.forEach(m=>{if(Math.random()<0.3){m.odds[0]=(parseFloat(m.odds[0])+(Math.random()-0.5)*0.2).toFixed(2);m.odds[1]=(parseFloat(m.odds[1])+(Math.random()-0.5)*0.2).toFixed(2);m.odds[2]=(parseFloat(m.odds[2])+(Math.random()-0.5)*0.2).toFixed(2)}});render()},5000);
let fly=false,mult=1,cr=2,hs=[2.3,1.2,5.4,1.09];function run(){fly=true;mult=1;cr=Math.random()*10+1.5;let iv=setInterval(()=>{if(!fly){clearInterval(iv);return}mult+=0.05;document.getElementById('mu').innerText=mult.toFixed(2)+'x';document.getElementById('pl').style.transform=`translateX(${mult*10}px)`;if(mult>=cr){fly=false;document.getElementById('mu').innerText='CRASH '+cr.toFixed(2)+'x';document.getElementById('mu').style.color='red';hs.unshift(cr);document.getElementById('hist').innerHTML=hs.slice(0,10).map(v=>`<span style="padding:3px 6px;border-radius:10px;font-size:10px;font-weight:800;background:${v<2?'#ff3b30':v<5?'#ffcc00':'#00e676'}">${v.toFixed(2)}x</span>`).join('');setTimeout(()=>{document.getElementById('mu').style.color='#ffcc00';run()},3000);clearInterval(iv)}},80)}run();function av(){let b=document.getElementById('ab');if(b.innerText=='BET'){b.innerText='CASHOUT';b.style.background='#ffcc00'}else{let am=document.getElementById('am').value;let w=am*mult;alert('WIN KES '+w.toFixed(2));b.innerText='BET';b.style.background='#00e676'}}
</script></body></html>
