<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FOOTY PRO 2026</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#0e1620;color:#fff;padding-bottom:80px}.top{background:#ffcc00;padding:10px;display:flex;justify-content:space-between;color:#000;font-weight:900;position:sticky;top:0;z-index:99}.bal{background:#000;color:#ffcc00;padding:5px 12px;border-radius:20px}.nav{display:flex;background:#1a2935;position:sticky;top:42px;z-index:98;overflow:auto}.nav button{flex:1;padding:12px;background:transparent;border:none;color:#8aa1b5;font-weight:700;border-bottom:3px solid transparent;white-space:nowrap}.nav button.active{color:#fff;border-color:#ffcc00}.match{background:#1a2935;margin:1px 0;padding:12px}.odds{display:flex;gap:5px;margin-top:8px}.odds div{flex:1;background:#253a4a;padding:10px;text-align:center;border-radius:6px;font-weight:800;border:1px solid #333}.odds div.selected{background:#ffcc00;color:#000}.betslip{position:fixed;bottom:0;left:0;right:0;background:#1a2935;border-top:2px solid #ffcc00;padding:10px;display:flex;justify-content:space-between;z-index:100}.page{display:none}.page.active{display:block}.av{background:#0a121a;height:220px;position:relative;margin:8px;border-radius:12px}.mult{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:48px;font-weight:900;color:#ffcc00}#plane{position:absolute;bottom:40px;left:20px;font-size:30px;transition:all .1s}</style></head><body>
<div class="top"><div>FOOTYPRO 2026</div><div class="bal">KES <span id="b">50.00</span></div></div>
<div class="nav"><button class="active" onclick="t('s',this)">⚽ SOCCER</button><button onclick="t('a',this)">✈️ AVIATOR</button><button onclick="t('m',this)">👤 M-PESA</button></div>
<div id="s" class="page active"><div class="match"><div style="display:flex;justify-content:space-between"><b>Gor Mahia vs AFC Leopards</b><span style="color:#00e676;font-size:11px">Today 15:00</span></div><div class="odds"><div onclick="s(this)">1<br>2.10</div><div onclick="s(this)">X<br>3.00</div><div onclick="s(this)">2<br>3.40</div></div></div><div class="match"><div style="display:flex;justify-content:space-between"><b>Man City vs Arsenal</b><span style="color:#8aa1b5;font-size:11px">Today 17:30</span></div><div class="odds"><div onclick="s(this)">1<br>2.15</div><div onclick="s(this)">X<br>3.40</div><div onclick="s(this)">2<br>3.20</div></div></div><div class="match"><div style="display:flex;justify-content:space-between"><b>Tusker vs KCB</b><span style="color:#8aa1b5;font-size:11px">Tomorrow</span></div><div class="odds"><div onclick="s(this)">1<br>1.95</div><div onclick="s(this)">X<br>3.20</div><div onclick="s(this)">2<br>3.80</div></div></div></div>
<div id="a" class="page"><div class="av"><div id="mu" class="mult">1.00x</div><div id="plane">✈️</div></div><div style="display:flex;gap:8px;padding:10px"><input id="am" value="20" style="flex:1;padding:12px;background:#1a2935;border:1px solid #333;color:#fff;border-radius:8px;text-align:center"><button id="ab" onclick="av()" style="flex:1;padding:12px;background:#00e676;border:none;border-radius:8px;font-weight:900">BET</button></div></div>
<div id="m" class="page"><div style="padding:15px"><div style="background:#1a2935;padding:15px;border-radius:12px"><h3 style="color:#ffcc00">M-PESA DEPOSIT</h3><p style="margin:10px 0;font-size:13px">Lipa: 0743... Paybill: ...</p><button style="width:100%;padding:14px;background:#ffcc00;border:none;border-radius:10px;font-weight:900">DEPOSIT</button></div></div></div>
<div class="betslip"><div><small>Betslip</small><div><b id="c">0</b> bets - KES <span id="st">0</span></div></div><button style="padding:12px 20px;background:#ffcc00;border:none;border-radius:8px;font-weight:900" onclick="alert('Bet placed!')">PLACE BET</button></div>
<script>let cc=0;function t(id,e){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));e.classList.add('active')}function s(el){el.classList.toggle('selected');cc=document.querySelectorAll('.selected').length;document.getElementById('c').innerText=cc;document.getElementById('st').innerText=cc*50}
let fly=false,m=1,cr=2;function run(){fly=true;m=1;cr=Math.random()*10+1.5;let iv=setInterval(()=>{if(!fly){clearInterval(iv);return}m+=0.05+m*0.01;document.getElementById('mu').innerText=m.toFixed(2)+'x';document.getElementById('plane').style.left=(m*15)+'px';document.getElementById('plane').style.bottom=(40+m*5)+'px';if(m>=cr){fly=false;document.getElementById('mu').innerText='CRASH '+cr.toFixed(2)+'x';document.getElementById('mu').style.color='red';setTimeout(()=>{document.getElementById('mu').style.color='#ffcc00';document.getElementById('plane').style.left='20px';document.getElementById('plane').style.bottom='40px';run()},3000);clearInterval(iv)}},80)}run();function av(){let b=document.getElementById('ab');if(b.innerText=='BET'){b.innerText='CASHOUT';b.style.background='#ffcc00'}else{let am=document.getElementById('am').value;let w=am*m;alert('WIN KES '+w.toFixed(2));document.getElementById('b').innerText=(parseFloat(document.getElementById('b').innerText)+w).toFixed(2);b.innerText='BET';b.style.background='#00e676'}}</script></body></html>
